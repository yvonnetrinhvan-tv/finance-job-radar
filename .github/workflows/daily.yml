name: Finance Job Radar daily scan
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *' # 08:15 Vietnam time, UTC+7
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: finance-job-radar
  cancel-in-progress: false
jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public listings
        run: python collector.py
      - name: Save latest discovery results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git diff --cached --quiet || (git commit -m 'Update job leads' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
